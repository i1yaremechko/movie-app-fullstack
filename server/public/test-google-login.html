<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Тест Google-входу</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body style="font-family: sans-serif; padding: 40px;">
    <h1>Тест Google-входу</h1>

    <div
      id="g_id_onload"
      data-client_id="880091541747-7v131o9updffvua7i6tpd97fek3sg92l.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-use_fedcm_for_button="true"></div>
    </div>
    <div class="g_id_signin" data-type="standard" data-use_fedcm_for_button="true"></div>

    <pre
      id="result"
      style="margin-top: 20px; background: #f4f4f4; padding: 12px;"
    ></pre>

    <button id="me-btn">Перевірити /api/auth/me</button>
    <button id="logout-btn">Вийти</button>

    <script src="/test-google-login.js"></script>
  </body>
</html>
